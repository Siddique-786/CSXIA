<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#555555" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,15 85,35 85,75 50,95 15,75 15,35" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner Builder Blocks -->
  <path d="M 35,42 L 50,32 L 65,42 L 65,58 L 50,68 L 35,58 Z" fill="none" stroke="url(#grad2)" stroke-width="2"/>
  <path d="M 50,32 L 50,68" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
  <path d="M 35,42 L 65,58" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
  <path d="M 65,42 L 35,58" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5"/>
  <!-- Central Glowing Dot -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#glow)"/>
</svg>
